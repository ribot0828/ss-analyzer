<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS-Analyzer | 期待値統合・解析システム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 md:mb-12 text-center animate-fade">
            <h1 class="text-3xl md:text-4xl font-bold mb-2 tracking-tight text-white">SS-Analyzer</h1>
            <p class="text-slate-400 text-sm md:text-base">SS-Engine 期待値統合・解析システム v2.1</p>
        </header>

        <main class="space-y-8">
            <!-- Dropzone Section -->
            <section class="glass-panel animate-fade" style="animation-delay: 0.1s;">
                <h2 class="text-xl font-semibold mb-4">① データ読み込み</h2>
                <div id="dropzone" class="p-6 md:p-12">
                    <p class="text-lg">タップしてファイルを選択</p>
                    <p class="text-xs md:text-sm text-slate-400 mt-2">（またはCSVをドラッグ＆ドロップ）</p>
                </div>
                <div id="file-list" class="mt-4 flex flex-wrap gap-2"></div>
            </section>

            <!-- Control Panel -->
            <section class="glass-panel animate-fade flex flex-wrap gap-4 items-center justify-between" style="animation-delay: 0.2s;">
                <div>
                    <h2 class="text-xl font-semibold">② 操作パネル</h2>
                    <p class="text-sm text-slate-400">データの統合と解析をブラウザで完結させます</p>
                </div>
                <div class="flex gap-4">
                    <button id="integrateBtn" class="btn-primary px-6 py-3 rounded-lg font-semibold" disabled>データを統合してダウンロード</button>
                    <button id="analyzeBtn" class="btn-primary px-6 py-3 rounded-lg font-semibold" disabled>集計・解析を実行</button>
                </div>
            </section>

            <!-- Analysis View -->
            <section id="analysisSection" class="glass-panel animate-fade hidden" style="animation-delay: 0.3s;">
                <h2 class="text-lg md:text-xl font-semibold mb-6">③ 解析結果・パフォーマンス診断</h2>
                
                <div class="mb-10">
                    <h3 class="text-lg font-medium mb-4 text-blue-400">📈 Equity Curve（期待値収束グラフ）</h3>
                    <div class="chart-container" style="position: relative; height:400px; width:100%">
                        <canvas id="equityChart"></canvas>
                    </div>
                </div>

                <!-- Dynamic Area for Tables -->
                <div id="analysisResultArea" class="space-y-12">
                    <!-- JSでテーブルを生成・挿入します -->
                </div>
            </section>

            <!-- Gemini Export -->
            <section id="geminiExportSection" class="glass-panel animate-fade hidden" style="animation-delay: 0.4s;">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">④ Gemini解析用サマリー</h2>
                    <button id="copyBtn" class="btn-primary px-4 py-2 rounded-md text-sm">コピー</button>
                </div>
                <p class="text-sm text-slate-400 mb-2">※解析完了時に自動でクリップボードにコピーされます。</p>
                <textarea id="geminiOutput" class="summary-area w-full" style="height: 300px;" readonly></textarea>
            </section>
        </main>

        <footer class="mt-12 text-center text-slate-500 text-sm">
            <p>&copy; 2026 SS-Analyzer Project | Professional Keiba Analytics</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 right-8 bg-blue-600 text-white px-6 py-3 rounded-lg shadow-xl opacity-0 translate-y-20 transition-all duration-300 z-50 pointer-events-none">
        解析完了！サマリーをコピーしました。
    </div>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#3b82f6', secondary: '#8b5cf6' } } }
        }
    </script>
    <script src="analyzer.js"></script>
</body>
</html>
