<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS-Analyzer | 期待値統合・解析システム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 md:mb-12 text-center animate-fade">
            <h1 class="text-3xl md:text-4xl font-bold mb-2 tracking-tight">SS-Analyzer</h1>
            <p class="text-slate-400 text-sm md:text-base">SS-Engine 期待値統合・解析システム</p>
        </header>

        <main class="space-y-8">
            <!-- Dropzone Section -->
            <section class="glass-panel animate-fade" style="animation-delay: 0.1s;">
                <h2 class="text-xl font-semibold mb-4">① データ読み込み</h2>
                <div id="dropzone" class="p-6 md:p-12">
                    <p class="text-lg">タップしてファイルを選択</p>
                    <p class="text-xs md:text-sm text-slate-400 mt-2">（またはCSVをドラッグ＆ドロップ）</p>
                </div>
                <div id="file-list" class="mt-4 flex flex-wrap gap-2"></div>
            </section>

            <!-- Control Panel -->
            <section class="glass-panel animate-fade flex flex-wrap gap-4 items-center justify-between" style="animation-delay: 0.2s;">
                <div>
                    <h2 class="text-xl font-semibold">② 操作パネル</h2>
                    <p class="text-sm text-slate-400">データの統合と解析を実行します</p>
                </div>
                <div class="flex gap-4">
                    <button id="btn-integrate" class="btn-primary px-6 py-3 rounded-lg font-semibold" disabled>データを統合してダウンロード</button>
                    <button id="btn-analyze" class="btn-primary px-6 py-3 rounded-lg font-semibold" disabled>集計・解析を実行</button>
                </div>
            </section>

            <!-- Analysis View -->
            <section id="analysis-view" class="glass-panel animate-fade hidden" style="animation-delay: 0.3s;">
                <h2 class="text-lg md:text-xl font-semibold mb-6">③ クラス別パフォーマンスマトリックス</h2>
                <div class="overflow-x-auto -mx-4 md:mx-0">
                    <table class="analysis-table text-sm md:text-base min-w-[600px] md:min-w-full">
                        <thead>
                            <tr>
                                <th>クラス</th>
                                <th>頭数 (サンプル)</th>
                                <th>1着率 (勝率)</th>
                                <th>3着以内率 (複勝率)</th>
                                <th>単勝回収率</th>
                                <th>平均EV (確定値)</th>
                            </tr>
                        </thead>
                        <tbody id="analysis-tbody">
                            <!-- JSで生成 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Gemini Export -->
            <section id="gemini-export" class="glass-panel animate-fade hidden" style="animation-delay: 0.4s;">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">④ Gemini解析用サマリー</h2>
                    <button id="btn-copy-markdown" class="btn-primary px-4 py-2 rounded-md text-sm">クリップボードにコピー</button>
                </div>
                <p class="text-sm text-slate-400 mb-2">Gemini 3 思考モードにこのまま貼り付けて詳細分析を依頼できます。</p>
                <textarea id="markdown-output" class="summary-area" readonly></textarea>
            </section>
        </main>

        <footer class="mt-12 text-center text-slate-500 text-sm">
            <p>&copy; 2026 SS-Analyzer Project | Dark Mode Glassmorphism Interface</p>
        </footer>
    </div>

    <!-- Tailwind CSS (CDN for layout utilities) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <script src="analyzer.js"></script>
</body>
</html>
